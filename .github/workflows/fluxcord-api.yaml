# Fluxcord: builds only the patched fluxer-api image. The rest of a Fluxer deployment keeps the
# upstream images. See fluxcord/README.md.
name: fluxcord api image

on:
  push:
    branches: [fluxcord]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluxcord-api
  cancel-in-progress: false

jobs:
  check:
    name: typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile --filter 'fluxer_api...' --ignore-scripts
      - name: Typecheck
        run: pnpm --filter fluxer_api run typecheck
      - name: Test
        working-directory: fluxer_api
        run: npx vitest run src/api/channel/repositories/message/
      - name: Test email
        working-directory: fluxer_api/pkgs/email
        run: npx vitest run src/EmailService

  image:
    name: image (${{ matrix.platform }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Variables
        id: vars
        run: |
          echo "version=$(cat fluxcord/base-version)" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=UTC git log -1 --pretty=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fluxer-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: fluxer_api/Dockerfile
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=${{ steps.vars.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          # The upstream version: the API reports it, and the other services expect it.
          build-args: |
            BUILD_VERSION=${{ steps.vars.outputs.version }}
            SOURCE_SHA=${{ github.sha }}
            SOURCE_DATE=${{ steps.vars.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: digest-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish the multi-arch image
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: fluxcord
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch index
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fluxer-api"
          version="$(cat "${GITHUB_WORKSPACE}/fluxcord/base-version")"
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "${image}:${version}-fluxcord" \
            -t "${image}:fluxcord" \
            -t "${image}:sha-${GITHUB_SHA::7}" \
            $(printf "${image}@sha256:%s " *)
          echo "Published ${image}:${version}-fluxcord" >> "$GITHUB_STEP_SUMMARY"
